[audio]
enable_overdrive = true

[backdrop]
blur_intensity = 0.68999998457729816
tint_intensity = 0.0

[bar]
order = ["bar"]

[bar.bar]
background_opacity = 0.0
border_width = 0.0
capsule = true
capsule_border = "outline_variant"
capsule_foreground = "secondary"
capsule_opacity = 0.79
capsule_padding = 10.0
capsule_radius = 80
capsule_thickness = 0.95999998226761818
enabled = true
panel_overlap = 12
font_family = "JetBrains Mono"
font_weight = 600
margin_ends = 14
margin_edge = 10
scale = 1.1
shadow = false
end = [
    "group:g2",
    "volume",
    "clipboard",
    "tray",
    "notifications",
    "session",
]
center = ["clock"]
start = ["launcher", "workspaces", "group:g1"]
thickness = 36

[[bar.bar.capsule_group]]
accordion = false
accordion_direction = "end"
border = "outline_variant"
enabled = true
fill = "surface_container"
foreground = "secondary"
id = "g1"
members = ["sysmon", "ram", "network", "bluetooth"]
opacity = 0.79
padding = 10.0
radius = 80.0
widget_spacing = 12

[[bar.bar.capsule_group]]
accordion = false
accordion_direction = "end"
border = "outline_variant"
enabled = true
fill = "surface_container"
foreground = "secondary"
id = "g2"
members = ["media", "mediatoggle"]
opacity = 0.79
padding = 10.0
radius = 80.0
widget_spacing = 6


[brightness]
enable_ddcutil = false

[desktop_widgets]
schema_version = 2
widget_order = ["desktop-widget-0000000000000003"]

[desktop_widgets.grid]
cell_size = 16
major_interval = 4
visible = false

[desktop_widgets.widget.desktop-widget-0000000000000003]
box_height = 0.0
box_width = 0.0
cx = 1280.0
cy = 720.0
rotation = 0.0
type = "fancy_audio_visualizer"

[desktop_widgets.widget.desktop-widget-0000000000000003.settings]
background = false
visualization_mode = "wave_rings"

[dock]
auto_hide = false
background_opacity = 0.6
border = "primary"
border_width = 2.0
enabled = true
margin_edge = 10
radius = 20
reserve_space = false
show_dots = true
smart_auto_hide = true
# 常驻应用。QQ 用 linuxqq-wayland-fix（本地 qq.desktop 是 Hidden=true 的占位）
pinned = [
    "com.spotify.Client",
    "com.tencent.WeChat",
    "linuxqq-wayland-fix",
    "google-chrome",
    "localsend",
]

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 300.0

[hooks]
theme_mode_changed = "nyxuri theme sync"
wallpaper_changed = ["~/.config/noctalia/wallpaper-hook.sh"]

[hot_corners.bottom_right]
action = "window_switcher"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = []

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true


[location]
custom_schedule = false

[nightlight]
enabled = false
temperature_day = 6500
temperature_night = 5500

[osd]
background_opacity = 0.84999998100101948
border = true
border_color = "primary"
border_width = 2.0
offset_y = 20
position = "bottom_center"
scale = 0.90000000596046448

[osd.kinds]
media = false
nightlight = false

[shell]
font_family = "Noto Sans CJK SC"
polkit_agent = true
settings_show_advanced = true

[shell.greeter_sync]
auto_sync = true
privilege_command = "pkexec"

[shell.panel]
control_center_placement = "floating"
control_center_position = "auto"
open_near_click_control_center = true
session_placement = "floating"
session_position = "center"
transparency_mode = "glass"
wallpaper_placement = "floating"
wallpaper_position = "center"

[[shell.session.actions]]
action = "lock"
countdown_seconds = 0.0
enabled = true
shortcut = "1"
variant = "default"

[[shell.session.actions]]
action = "logout"
countdown_seconds = 0.0
enabled = true
shortcut = "2"
variant = "default"

[[shell.session.actions]]
action = "lock_and_suspend"
countdown_seconds = 0.0
enabled = true
shortcut = "3"
variant = "default"

[[shell.session.actions]]
action = "reboot"
countdown_seconds = 0.0
enabled = true
shortcut = "4"
variant = "default"

[[shell.session.actions]]
action = "shutdown"
countdown_seconds = 0.0
enabled = true
shortcut = "5"
variant = "destructive"

[[shell.session.actions]]
action = "command"
command = "notify-send 'Noctalia' 'Custom session entry'"
countdown_seconds = 0.0
enabled = false
variant = "default"

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "light"
shell_mode = "auto"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

[theme.templates]
builtin_ids = ["gtk3", "gtk4", "kcolorscheme", "kitty", "niri", "qt"]
community_ids = ["fuzzel", "fastfetch", "starship", "yazi"]

# NyxMellow 动态 fcitx5 皮肤（mellow 形状 + Material You 自动取色）
# 路径中的 /home/user 为占位符，由 nyxuri.deploy 在部署时替换为实际 $HOME
[theme.templates.user.nyxmellow_theme]
index = 0
input_path = "/home/user/.local/share/fcitx5/themes/nyxmellow/templates/theme.conf"
output_path = "/home/user/.local/share/fcitx5/themes/nyxmellow/theme.conf"

[theme.templates.user.nyxmellow_panel]
index = 1
input_path = "/home/user/.local/share/fcitx5/themes/nyxmellow/templates/panel.svg"
output_path = "/home/user/.local/share/fcitx5/themes/nyxmellow/panel.svg"

[theme.templates.user.nyxmellow_highlight]
index = 2
input_path = "/home/user/.local/share/fcitx5/themes/nyxmellow/templates/highlight.svg"
output_path = "/home/user/.local/share/fcitx5/themes/nyxmellow/highlight.svg"
post_hook = "busctl --user --auto-start=no call org.fcitx.Fcitx5 /controller org.fcitx.Fcitx.Controller1 ReloadAddonConfig s classicui >/dev/null 2>&1 || true"

# GTK Material You 主题（移植自 HyprYou，由 Noctalia 动态渲染到 gtk.css）
# 路径中的 /home/user 为占位符，由 nyxuri.deploy 在部署时替换为实际 $HOME
[theme.templates.user.nyxuri_gtk3]
index = 3
input_path = "/home/user/.config/nyxuri/templates/gtk-3.0.css"
output_path = "/home/user/.config/gtk-3.0/gtk.css"

[theme.templates.user.nyxuri_gtk4]
index = 4
input_path = "/home/user/.config/nyxuri/templates/gtk-4.0.css"
output_path = "/home/user/.config/gtk-4.0/gtk.css"

# Niri glow-material-you: Noctalia is the only writer of the rendered layout.
[theme.templates.user.nyxuri_niri_glow_material_you]
index = 5
input_path = "/home/user/.config/nyxuri/templates/niri-glow-material-you.kdl"
output_path = "/home/user/.config/niri/colors.kdl"

# Material You 动态色板（由 Noctalia 渲染到 ~/.cache/nyxuri/palette.toml，供周边组件直接读取）
[theme.templates.user.palette]
index = 6
input_path = "/home/user/.config/nyxuri/templates/palette.toml"
output_path = "/home/user/.cache/nyxuri/palette.toml"

# Mango Material You 主题配色（适配 MangoWM >= 0.18.0 snake_case 语法）
[theme.templates.user.nyxuri_mango]
index = 7
input_path = "/home/user/.config/nyxuri/templates/mango.conf"
output_path = "/home/user/.config/mango/noctalia.conf"
post_hook = "mmsg dispatch reload_config 2>/dev/null || true"

# VS Code（Code - OSS）matugen-theme 扩展监听这两个文件；
# 由 Noctalia 用当前调色板渲染，扩展收到变更即重建主题。
[theme.templates.user.vscode_colors]
index = 8
input_path = "/home/user/.config/nyxuri/templates/vscode-colors"
output_path = "/home/user/.cache/matugen/vscode-colors"

[theme.templates.user.vscode_colors_json]
index = 9
input_path = "/home/user/.config/nyxuri/templates/vscode-colors.json"
output_path = "/home/user/.cache/matugen/vscode-colors.json"

# Adwaita-Matugen 文件夹图标重染（A/B 变体交替，强制应用重载图标缓存）
[theme.templates.user.icons_recolor]
index = 10
input_path = "/home/user/.config/nyxuri/templates/icons-recolor.sh"
output_path = "/home/user/.cache/nyxuri/icons-recolor.sh"
post_hook = "bash /home/user/.cache/nyxuri/icons-recolor.sh"

# Flameshot 截图工具的主题色（改动需重启 flameshot 生效）
[theme.templates.user.flameshot]
index = 11
input_path = "/home/user/.config/nyxuri/templates/flameshot.ini"
output_path = "/home/user/.config/flameshot/flameshot.ini"
post_hook = "pkill flameshot 2>/dev/null || true"

[wallpaper]
directory = "/home/user/图片/Wallpapers"
fill_mode = "crop"


[plugins]
enabled = ["noctalia/mpvpaper", "ech678/media-toggle"]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/worldcupfantasy/noctalia-plugins"
    name = "ech678"

[widget.active_window]
min_length = 0

[widget.clock]
format = "{:%m/%d/%y %H:%M}"

[widget.media]
hide_when_no_media = true
max_length = 170

[widget.mediatoggle]
type = "ech678/media-toggle:toggle"

[widget.tray]
detached_panel = true
drawer = false

[widget.ram]
show_glyph = false
visualization = "none"

[widget.sysmon]
glyph = "cpu"
visualization = "none"

# 电源键左键改成打开控制中心主页（Home 标签），会话菜单仍在 Home 顶部按钮里
[widget.session.actions]
left = "panel-toggle control-center home"

[widget.mpvpaper]
type = "noctalia/mpvpaper:mpvpaper"

[plugin_settings."noctalia/mpvpaper"]
mpv_options = "--config=no --load-scripts=no --script=~/.config/noctalia/mpv-hook.lua"
picker_placement = "floating"
video_directory = "/home/user/图片/Wallpapers/video"
